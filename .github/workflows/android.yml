name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: debug unit tests and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compileSdk 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and debug APK
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
